name: HL-WR832 Engineering Build

on:
  workflow_dispatch:

jobs:
  build-hl-wr832:
    name: Build Hooolink HL-WR832
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout engineering repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3 \
            python3-distutils rsync unzip zlib1g-dev file wget \
            curl subversion swig time xsltproc zstd

      - name: Clone official ROOter 23.05 source
        run: |
          git clone --depth=1 https://github.com/ofmodemsandmen/ROOterSource2305.git rooter

      - name: Verify engineering input files exist
        run: |
          test -f engineering/HL-WR832-board-support.patch
          test -f engineering/HL-WR832.config
          echo "HL-WR832 engineering inputs found."

      - name: Verify authoritative HL-WR832 inputs
        run: |
          echo "865cfb219f9799d7ccc884a83aa133ac0a843d7fee10ddf4b9f95618718cf6b3  engineering/HL-WR832-board-support.patch" | sha256sum -c -
          echo "ae3d50534180c1a525bcffad5d2719d91c93ce2a7e8d5981b530ed69eed10395  engineering/HL-WR832.config" | sha256sum -c -

      - name: Apply authoritative HL-WR832 board support
        working-directory: rooter
        run: |
          sed -e 's#^--- /mnt/data/hlwr832-build/pristine/ROOterSource2305-main/#--- a/#' \
              -e 's#^+++ /mnt/data/hlwr832-build/src/ROOterSource2305-main/#+++ b/#' \
              ../engineering/HL-WR832-board-support.patch | patch --batch --forward -p1

          test -f target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-hooolink-hl-wr832.dts
          grep -q 'compatible = "hooolink,hl-wr832"' target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-hooolink-hl-wr832.dts
          grep -q 'Device/hooolink_hl-wr832' target/linux/ipq40xx/image/generic.mk
          grep -q 'hooolink,hl-wr832' target/linux/ipq40xx/base-files/etc/board.d/02_network
          grep -q 'hooolink,hl-wr832' target/linux/ipq40xx/base-files/lib/upgrade/platform.sh

          echo "Authoritative HL-WR832 board support applied."

      - name: Verify exact authoritative HL-WR832 board hashes
        working-directory: rooter
        run: |
          echo "dc1b85db39b626211ce1e55e0c9ca8ec9bbb40d4dfd250cd3c0e54429304f03d  target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-hooolink-hl-wr832.dts" | sha256sum -c -
          echo "46c88fab33a4c5e9e7948e146eb2e36bc2a5e8f16d81a939a708a339c063294e  target/linux/ipq40xx/image/generic.mk" | sha256sum -c -
          echo "41f4f60f828d35aa06e9b249d47724d84e0b620c343f1dbf6930cac4a90dc6a4  target/linux/ipq40xx/base-files/etc/board.d/02_network" | sha256sum -c -
          echo "f6cc84ec286021b1f24670f560dccfb7b7ee8984b09e914e380c435000209406  target/linux/ipq40xx/base-files/lib/upgrade/platform.sh" | sha256sum -c -

      - name: Apply Build 9 HL-WR832 DTS syntax correction
        working-directory: rooter
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "target/linux/ipq40xx/files/arch/arm/boot/dts/"
              "qcom-ipq4019-hooolink-hl-wr832.dts"
          )

          text = path.read_text()

          old = '''/* GPIO20/21 and GPIO8/9 are board LTE-power controls, not I2C/UART1. */
          &i2c@78b7000 {
          	status = "disabled";
          };

          &serial@78b0000 {
          	status = "disabled";
          };

          '''

          if text.count(old) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one original invalid DTS override block."
              )

          text = text.replace(old, "", 1)

          anchor = "\t\t/delete-node/ leds;"

          if text.count(anchor) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one /delete-node/ leds anchor."
              )

          insertion = '''		/delete-node/ leds;

          	/* GPIO20/21 and GPIO8/9 are board LTE-power controls, not I2C/UART1. */
          	i2c@78b7000 {
          		status = "disabled";
          	};

          	serial@78b0000 {
          		status = "disabled";
          	};'''

          text = text.replace(anchor, insertion, 1)
          path.write_text(text)

          print("Build 9 DTS syntax correction applied.")
          PY

          DTS="target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-hooolink-hl-wr832.dts"

          if grep -q '^&i2c@78b7000' "$DTS"; then
            echo "ERROR: Invalid &i2c@78b7000 syntax still exists."
            exit 1
          fi

          if grep -q '^&serial@78b0000' "$DTS"; then
            echo "ERROR: Invalid &serial@78b0000 syntax still exists."
            exit 1
          fi

          test "$(grep -c '^[[:space:]]*i2c@78b7000 {' "$DTS")" -eq 1
          test "$(grep -c '^[[:space:]]*serial@78b0000 {' "$DTS")" -eq 1

          echo "cf9c7d8f429359c4eea4cfd30c9a185de4f8c36fee3f729c01a15b53b31fa4f8  $DTS" | sha256sum -c -

          echo "Corrected HL-WR832 DTS verified."

      - name: Install exact HL-WR832 configuration
        working-directory: rooter
        run: |
          cp ../engineering/HL-WR832.config .config

          echo "ae3d50534180c1a525bcffad5d2719d91c93ce2a7e8d5981b530ed69eed10395  .config" | sha256sum -c -

          grep -q '^CONFIG_TARGET_ipq40xx=y' .config
          grep -q '^CONFIG_TARGET_ipq40xx_generic=y' .config
          grep -q '^CONFIG_TARGET_PROFILE="DEVICE_hooolink_hl-wr832"$' .config

          echo "Exact authoritative HL-WR832 configuration installed."

      - name: Apply ucode dependency compatibility correction
        working-directory: rooter
        run: |
          sed -i \
            -e 's/^# CONFIG_PACKAGE_ucode-mod-nl80211 is not set$/CONFIG_PACKAGE_ucode-mod-nl80211=y/' \
            -e 's/^# CONFIG_PACKAGE_ucode-mod-rtnl is not set$/CONFIG_PACKAGE_ucode-mod-rtnl=y/' \
            -e 's/^# CONFIG_PACKAGE_ucode-mod-uloop is not set$/CONFIG_PACKAGE_ucode-mod-uloop=y/' \
            .config

          grep -q '^CONFIG_PACKAGE_ucode=y$' .config
          grep -q '^CONFIG_PACKAGE_wpad-basic-mbedtls=y$' .config
          grep -q '^CONFIG_PACKAGE_ucode-mod-nl80211=y$' .config
          grep -q '^CONFIG_PACKAGE_ucode-mod-rtnl=y$' .config
          grep -q '^CONFIG_PACKAGE_ucode-mod-uloop=y$' .config

          echo "ucode compatibility correction verified."

      - name: Apply authorized libdeflate 1.18 hash correction
        working-directory: rooter
        run: |
          sed -i 's/015cbd33b1382b812f7c035640709186bc5d3d6a0ab177bffa7948f26f64edf9/d35d1e0b1eadbee29e5d76cc9b059661147722b4c5ffccd2c1b4c65591a70bc0/' tools/libdeflate/Makefile

          grep -q 'd35d1e0b1eadbee29e5d76cc9b059661147722b4c5ffccd2c1b4c65591a70bc0' tools/libdeflate/Makefile

      - name: Download build sources
        working-directory: rooter
        run: |
          set -o pipefail
          make download -j2 V=s 2>&1 | tee ../download.log

      - name: Build HL-WR832 engineering sample
        working-directory: rooter
        run: |
          set -o pipefail
          make -j2 V=s 2>&1 | tee ../build.log

      - name: Require HL-WR832 firmware
        working-directory: rooter
        run: |
          IMAGE="bin/targets/ipq40xx/generic/openwrt-ipq40xx-generic-hooolink_hl-wr832-squashfs-sysupgrade.bin"

          if [ ! -s "$IMAGE" ]; then
            echo "ERROR: Expected HL-WR832 firmware was not produced."
            exit 1
          fi

          if find bin/targets -type f -iname '*habanero*' | grep -q .; then
            echo "ERROR: Unexpected Habanero firmware output detected."
            find bin/targets -type f -iname '*habanero*'
            exit 1
          fi

          echo "HL-WR832 firmware produced:"
          ls -lh "$IMAGE"

      - name: Create engineering checksums
        if: always()
        run: |
          mkdir -p engineering-output

          cp build.log engineering-output/ 2>/dev/null || true
          cp download.log engineering-output/ 2>/dev/null || true

          if [ -d rooter/bin/targets/ipq40xx/generic ]; then
            cp -a rooter/bin/targets/ipq40xx/generic/. engineering-output/
          fi

          cp engineering/HL-WR832.config \
            engineering-output/HL-WR832-authoritative.config

          cp engineering/HL-WR832-board-support.patch \
            engineering-output/HL-WR832-authoritative-board-support.patch

          if [ -f rooter/.config ]; then
            cp rooter/.config \
              engineering-output/HL-WR832-Build9-effective.config
          fi

          if [ -f rooter/target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-hooolink-hl-wr832.dts ]; then
            cp rooter/target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-hooolink-hl-wr832.dts \
              engineering-output/HL-WR832-Build9-effective.dts
          fi

          cd engineering-output
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Upload HL-WR832 engineering artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HL-WR832-ROOter2305-engineering
          path: engineering-output/
          if-no-files-found: error
          retention-days: 30
