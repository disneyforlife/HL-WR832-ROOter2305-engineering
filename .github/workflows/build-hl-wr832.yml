name: Build Official ROOter Firmware

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI button

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Personal Repo
      uses: actions/checkout@v4

    - name: Clean Runner Storage Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: Setup Ubuntu Compiler Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc \
        gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
        file wget subversion checkinstall jq

    # Clones the custom, pre-modified ROOter 23.05 framework repository
    - name: Pull Official ROOter Modified Repository
      run: |
        git clone https://github.com rooter-build
        cd rooter-build
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # Copies your pre-configured target router configuration to the build system
    - name: Apply Router Config Target
      run: |
        cd rooter-build
        if [ -f ../.config ]; then
          cp ../.config .config
        fi
        make defconfig
        make download

    - name: Compile ROOter Images
      run: |
        cd rooter-build
        make -j$(nproc) V=s

    - name: Archive Built Cellular Images
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-ROOter-Cellular-Firmware
        path: rooter-build/bin/targets/
