name: Build HL-WR832 full ROOter 23.05

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout engineering repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl patch xz-utils zstd

      - name: Clone ROOter 23.05
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ofmodemsandmen/ROOterSource2305.git rooter
          git -C rooter rev-parse HEAD

      - name: Verify engineering inputs
        shell: bash
        run: |
          set -euxo pipefail
          echo "865cfb219f9799d7ccc884a83aa133ac0a843d7fee10ddf4b9f95618718cf6b3  engineering/HL-WR832-board-support.patch" | sha256sum -c -
          echo "ae3d50534180c1a525bcffad5d2719d91c93ce2a7e8d5981b530ed69eed10395  engineering/HL-WR832.config" | sha256sum -c -

      - name: Apply HL-WR832 OEM board support
        working-directory: rooter
        shell: bash
        run: |
          set -euxo pipefail
          sed \
            -e 's#^--- /mnt/data/hlwr832-build/pristine/ROOterSource2305-main/#--- a/#' \
            -e 's#^+++ /mnt/data/hlwr832-build/src/ROOterSource2305-main/#+++ b/#' \
            ../engineering/HL-WR832-board-support.patch | patch --batch --forward -p1

          test -f target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-hooolink-hl-wr832.dts
          grep -Fq 'define Device/hooolink_hl-wr832' target/linux/ipq40xx/image/generic.mk
          grep -Fq 'TARGET_DEVICES += hooolink_hl-wr832' target/linux/ipq40xx/image/generic.mk
          grep -Fq 'compatible = "hooolink,hl-wr832"' target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-hooolink-hl-wr832.dts
          grep -Fq 'hooolink,hl-wr832' target/linux/ipq40xx/base-files/etc/board.d/02_network
          grep -Fq 'hooolink,hl-wr832' target/linux/ipq40xx/base-files/lib/upgrade/platform.sh
          git diff --check

      - name: Configure complete ROOter build
        working-directory: rooter
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../engineering/HL-WR832.config .config

          # The source tree defines the OEM image in generic.mk.
          # Select only the HL-WR832 device; do not select other generic boards.
          ./scripts/config --enable TARGET_ipq40xx
          ./scripts/config --enable TARGET_ipq40xx_generic
          ./scripts/config --disable TARGET_MULTI_PROFILE
          ./scripts/config --enable TARGET_ipq40xx_generic_DEVICE_hooolink_hl-wr832

          # Full ROOter/modem package set required by this build.
          ./scripts/config --enable PACKAGE_ext-rooter-lite
          ./scripts/config --enable PACKAGE_ext-rooter16
          ./scripts/config --enable PACKAGE_uqmi
          ./scripts/config --enable PACKAGE_umbim
          ./scripts/config --enable PACKAGE_kmod-usb-net-qmi-wwan
          ./scripts/config --enable PACKAGE_kmod-usb-net-mbim
          ./scripts/config --enable PACKAGE_kmod-usb-serial-option

          make defconfig V=s 2>&1 | tee ../defconfig.log
          grep -q '^CONFIG_TARGET_ipq40xx=y$' .config
          grep -q '^CONFIG_TARGET_ipq40xx_generic=y$' .config
          grep -q '^CONFIG_TARGET_ipq40xx_generic_DEVICE_hooolink_hl-wr832=y$' .config
          grep -q '^CONFIG_PACKAGE_ext-rooter-lite=y$' .config
          grep -q '^CONFIG_PACKAGE_ext-rooter16=y$' .config
          grep -q '^CONFIG_PACKAGE_uqmi=y$' .config
          grep -q '^CONFIG_PACKAGE_umbim=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-usb-net-mbim=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-usb-serial-option=y$' .config

      - name: Correct libdeflate source hash
        working-directory: rooter
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/015cbd33b1382b812f7c035640709186bc5d3d6a0ab177bffa7948f26f64edf9/d35d1e0b1eadbee29e5d76cc9b059661147722b4c5ffccd2c1b4c65591a70bc0/' tools/libdeflate/Makefile

      - name: Download ROOter sources
        working-directory: rooter
        shell: bash
        run: |
          set -o pipefail
          make download -j2 V=s 2>&1 | tee ../download.log

      - name: Build full HL-WR832 ROOter image
        working-directory: rooter
        shell: bash
        run: |
          set -o pipefail
          make -j2 V=s 2>&1 | tee ../build.log

      - name: Verify HL-WR832 image and ROOter packages
        working-directory: rooter
        shell: bash
        run: |
          set -euxo pipefail
          out=bin/targets/ipq40xx/generic
          test -f "$out/openwrt-ipq40xx-generic-hooolink_hl-wr832-squashfs-sysupgrade.bin"
          test -f "$out/openwrt-ipq40xx-generic-hooolink_hl-wr832-squashfs-sysupgrade.bin.sha256sum"
          find bin/packages -type f \( \
            -name 'ext-rooter-lite_*.ipk' -o -name 'ext-rooter16_*.ipk' -o \
            -name 'uqmi_*.ipk' -o -name 'umbim_*.ipk' -o \
            -name 'kmod-usb-net-qmi-wwan_*.ipk' -o \
            -name 'kmod-usb-net-mbim_*.ipk' -o \
            -name 'kmod-usb-serial-option_*.ipk' \) -print | sort | tee ../required-package-files.txt
          test "$(wc -l < ../required-package-files.txt)" -ge 7

      - name: Collect evidence
        if: always()
        shell: bash
        run: |
          set -eux
          mkdir -p artifact
          cp engineering/HL-WR832-board-support.patch artifact/
          cp engineering/HL-WR832.config artifact/
          [ ! -f defconfig.log ] || cp defconfig.log artifact/
          [ ! -f download.log ] || cp download.log artifact/
          [ ! -f build.log ] || cp build.log artifact/
          [ ! -f required-package-files.txt ] || cp required-package-files.txt artifact/
          [ ! -f rooter/.config ] || cp rooter/.config artifact/effective.config
          [ ! -f rooter/target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-hooolink-hl-wr832.dts ] || cp rooter/target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-hooolink-hl-wr832.dts artifact/effective.dts
          if [ -d rooter/bin/targets/ipq40xx/generic ]; then
            mkdir -p artifact/firmware
            cp -a rooter/bin/targets/ipq40xx/generic/. artifact/firmware/
          fi

      - name: Upload firmware and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HL-WR832-full-ROOter-23.05
          path: artifact/
          if-no-files-found: error
          retention-days: 30
