name: Build HL-WR832 ROOter 23.05 Engineering Build 17

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout engineering repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          set -o pipefail
          {
            set -eux

            echo "Runner OS:"
            cat /etc/os-release

            echo "Architecture:"
            uname -a

            sudo apt-get update

            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential \
              clang \
              flex \
              bison \
              g++ \
              gawk \
              gcc-multilib \
              gettext \
              git \
              libncurses-dev \
              libssl-dev \
              python3 \
              python3-dev \
              python3-setuptools \
              rsync \
              swig \
              unzip \
              zlib1g-dev \
              file \
              wget \
              curl \
              patch \
              xz-utils \
              zstd

            git --version
            python3 --version
            gcc --version | head -n 1
          } 2>&1 | tee bootstrap.log

      - name: Clone pristine ROOter 23.05 source
        run: |
          set -o pipefail
          {
            set -eux

            git clone --depth 1 \
              https://github.com/ofmodemsandmen/ROOterSource2305.git \
              rooter

            git -C rooter rev-parse HEAD
          } 2>&1 | tee clone.log

      - name: Verify authoritative engineering inputs
        run: |
          set -euxo pipefail

          echo "865cfb219f9799d7ccc884a83aa133ac0a843d7fee10ddf4b9f95618718cf6b3  engineering/HL-WR832-board-support.patch" \
            | sha256sum -c -

          echo "ae3d50534180c1a525bcffad5d2719d91c93ce2a7e8d5981b530ed69eed10395  engineering/HL-WR832.config" \
            | sha256sum -c -

      - name: Apply HL-WR832 board integration patch
        working-directory: rooter
        run: |
          set -euxo pipefail

          sed \
            -e 's#^--- /mnt/data/hlwr832-build/pristine/ROOterSource2305-main/#--- a/#' \
            -e 's#^+++ /mnt/data/hlwr832-build/src/ROOterSource2305-main/#+++ b/#' \
            ../engineering/HL-WR832-board-support.patch \
            | patch --batch --forward -p1

          test -f \
            target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-hooolink-hl-wr832.dts

          grep -q 'TARGET_DEVICES += hooolink_hl-wr832' \
            target/linux/ipq40xx/image/generic.mk

          grep -q 'hooolink,hl-wr832' \
            target/linux/ipq40xx/base-files/etc/board.d/02_network

          grep -q 'hooolink,hl-wr832' \
            target/linux/ipq40xx/base-files/lib/upgrade/platform.sh

          git diff --check

      - name: Install hard-coded HL-WR832 board DTS
        working-directory: rooter
        run: |
          set -euxo pipefail

          cat > target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-hooolink-hl-wr832.dts <<'HLWR832_DTS'
/* SPDX-License-Identifier: GPL-2.0-or-later OR MIT */
/* Hooolink HL-WR832 - OEM/dump-derived board definition. */
/* Generic IPQ4019 nodes are used only for SoC/software structure. */

#include "qcom-ipq4019.dtsi"
#include <dt-bindings/gpio/gpio.h>
#include <dt-bindings/input/input.h>
#include <dt-bindings/soc/qcom,tcsr.h>

/ {
  model = "Hooolink HL-WR832";
  compatible = "hooolink,hl-wr832", "qcom,ipq4019";

  memory {
    device_type = "memory";
    reg = <0x80000000 0x20000000>; /* OEM/board evidence: 512 MiB */
  };

  soc {
    mdio@90000 {
      status = "okay";
      pinctrl-0 = <&hlwr832_mdio_pins>;
      pinctrl-names = "default";
    };

    tcsr@1949000 {
      compatible = "qcom,tcsr";
      reg = <0x1949000 0x100>;
      qcom,wifi_glb_cfg = <TCSR_WIFI_GLB_CFG>;
    };

    tcsr@194b000 {
      compatible = "qcom,tcsr";
      reg = <0x194b000 0x100>;
      qcom,usb-hsphy-mode-select = <TCSR_USB_HSPHY_HOST_MODE>;
    };

    ess_tcsr@1953000 {
      compatible = "qcom,tcsr";
      reg = <0x1953000 0x1000>;
      qcom,ess-mac-mode = <TCSR_ESS_MAC_MODE_PSGMII>;
    };

    tcsr@1957000 {
      compatible = "qcom,tcsr";
      reg = <0x1957000 0x100>;
      qcom,wifi_noc_memtype_m0_m2 = <TCSR_WIFI_NOC_MEMTYPE_M0_M2>;
    };
  };

  keys {
    compatible = "gpio-keys";

    reset {
      label = "reset";
      gpios = <&tlmm 18 GPIO_ACTIVE_LOW>;
      linux,code = <KEY_RESTART>;
    };
  };

  aliases {
    led-boot = &led_sys;
    led-failsafe = &led_sys;
    led-running = &led_sys;
    led-upgrade = &led_sys;
  };

  leds {
    compatible = "gpio-leds";

    led_sys: sys {
      label = "green:sys";
      gpios = <&tlmm 3 GPIO_ACTIVE_HIGH>;
    };

    led_2g: wifi2g {
      label = "green:wifi2g";
      gpios = <&tlmm 1 GPIO_ACTIVE_HIGH>;
    };

    led_5g: wifi5g {
      label = "green:wifi5g";
      gpios = <&tlmm 2 GPIO_ACTIVE_HIGH>;
    };

    led_usb: usb {
      label = "green:usb";
      gpios = <&tlmm 5 GPIO_ACTIVE_HIGH>;
    };

    led_internet: internet {
      label = "green:internet";
      gpios = <&tlmm 4 GPIO_ACTIVE_HIGH>;
    };
  };

  gpio-export {
    compatible = "gpio-export";

    lte_pwr_sw {
      gpio-export,name = "lte_pwr_sw";
      gpio-export,output = <1>;
      gpios = <&tlmm 0 GPIO_ACTIVE_HIGH>;
    };

    lte_pwr_en1 {
      gpio-export,name = "lte_pwr_en1";
      gpio-export,output = <1>;
      gpios = <&tlmm 9 GPIO_ACTIVE_HIGH>;
    };

    lte_pwr_en2 {
      gpio-export,name = "lte_pwr_en2";
      gpio-export,output = <1>;
      gpios = <&tlmm 10 GPIO_ACTIVE_HIGH>;
    };

    lte_pwr_en3 {
      gpio-export,name = "lte_pwr_en3";
      gpio-export,output = <1>;
      gpios = <&tlmm 11 GPIO_ACTIVE_HIGH>;
    };

    lte_pwr_en4 {
      gpio-export,name = "lte_pwr_en4";
      gpio-export,output = <1>;
      gpios = <&tlmm 8 GPIO_ACTIVE_HIGH>;
    };

    lte_pwr_en5 {
      gpio-export,name = "lte_pwr_en5";
      gpio-export,output = <1>;
      gpios = <&tlmm 34 GPIO_ACTIVE_HIGH>;
    };

    lte_pwr_en6 {
      gpio-export,name = "lte_pwr_en6";
      gpio-export,output = <1>;
      gpios = <&tlmm 35 GPIO_ACTIVE_HIGH>;
    };

    lte_pwr_en7 {
      gpio-export,name = "lte_pwr_en7";
      gpio-export,output = <1>;
      gpios = <&tlmm 20 GPIO_ACTIVE_HIGH>;
    };

    lte_pwr_hub {
      gpio-export,name = "lte_pwr_hub";
      gpio-export,output = <1>;
      gpios = <&tlmm 21 GPIO_ACTIVE_HIGH>;
    };
  };
};

&blsp_dma {
  status = "okay";
};

&qpic_bam {
  status = "okay";
};

&tlmm {
  hlwr832_mdio_pins: hlwr832-mdio-pins {
    mux-mdio {
      pins = "gpio6";
      function = "mdio";
      bias-pull-up;
    };

    mux-mdc {
      pins = "gpio7";
      function = "mdc";
      bias-pull-up;
    };
  };

  hlwr832_serial0_pins: hlwr832-serial0-pins {
    mux {
      pins = "gpio16", "gpio17";
      function = "blsp_uart0";
      bias-disable;
    };
  };

  hlwr832_spi0_pins: hlwr832-spi0-pins {
    data-clock {
      function = "blsp_spi0";
      pins = "gpio13", "gpio14", "gpio15";
      drive-strength = <12>;
      bias-disable;
    };

    chip-select {
      function = "gpio";
      pins = "gpio12";
      drive-strength = <2>;
      bias-disable;
      output-high;
    };
  };

  nand_pins: hlwr832-nand-pins {
    pullups {
      pins = "gpio53", "gpio58", "gpio59";
      function = "qpic";
      bias-pull-up;
    };

    pulldowns {
      pins = "gpio54", "gpio55", "gpio56", "gpio57",
             "gpio60", "gpio61", "gpio62", "gpio63",
             "gpio64", "gpio65", "gpio66", "gpio67",
             "gpio68", "gpio69";
      function = "qpic";
      bias-pull-down;
    };
  };
};

&usb3_ss_phy {
  status = "okay";
};

&usb3_hs_phy {
  status = "okay";
};

&usb2_hs_phy {
  status = "okay";
};

&blsp1_spi1 {
  pinctrl-0 = <&hlwr832_spi0_pins>;
  pinctrl-names = "default";
  status = "okay";
  cs-gpios = <&tlmm 12 GPIO_ACTIVE_LOW>;

  flash@0 {
    reg = <0>;
    compatible = "jedec,spi-nor";
    spi-max*
