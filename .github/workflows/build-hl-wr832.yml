name: Build HL-WR832 ROOter 23.05 Engineering Build 17

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout engineering repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        id: deps
        continue-on-error: true
        run: |
          set -o pipefail
          {
            set -eux
            echo "Runner OS:"
            cat /etc/os-release
            echo "Architecture:"
            uname -a
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential clang flex bison g++ gawk gcc-multilib gettext git \
              libncurses-dev libssl-dev python3 python3-dev python3-setuptools \
              rsync swig unzip zlib1g-dev file wget curl patch xz-utils zstd
            git --version
            python3 --version
            gcc --version | head -n 1
          } 2>&1 | tee bootstrap.log

      - name: Clone pristine ROOter 23.05 source
        id: clone
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            set -eux
            git clone --depth 1 https://github.com/ofmodemsandmen/ROOterSource2305.git rooter
            git -C rooter rev-parse HEAD
          } 2>&1 | tee clone.log

      - name: Verify authoritative engineering inputs
        if: steps.clone.outcome == 'success'
        run: |
          set -euxo pipefail
          echo "865cfb219f9799d7ccc884a83aa133ac0a843d7fee10ddf4b9f95618718cf6b3  engineering/HL-WR832-board-support.patch" | sha256sum -c -
          echo "ae3d50534180c1a525bcffad5d2719d91c93ce2a7e8d5981b530ed69eed10395  engineering/HL-WR832.config" | sha256sum -c -

      - name: Apply preserved HL-WR832 board integration patch
        working-directory: rooter
        run: |
          set -euxo pipefail
          sed \
            -e 's#^--- /mnt/data/hlwr832-build/pristine/ROOterSource2305-main/#--- a/#' \
            -e 's#^+++ /mnt/data/hlwr832-build/src/ROOterSource2305-main/#+++ b/#' \
            ../engineering/HL-WR832-board-support.patch | patch --batch --forward -p1

      - name: Install audited OEM-derived HL-WR832 DTS (with LTE Power Fixes)
        working-directory: rooter
        run: |
          set -euxo pipefail
          cat > target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-hooolink-hl-wr832.dts <<'HLWR832_DTS'
          /* SPDX-License-Identifier: GPL-2.0-or-later OR MIT */
          /* Hooolink HL-WR832 - OEM/dump-derived board definition. */
          /* Generic IPQ4019 nodes are used only for SoC/software structure. */
          
          #include "qcom-ipq4019.dtsi"
          #include <dt-bindings/gpio/gpio.h>
          #include <dt-bindings/input/input.h>
          #include <dt-bindings/soc/qcom,tcsr.h>
          
          / {
          	model = "Hooolink HL-WR832";
          	compatible = "hooolink,hl-wr832", "qcom,ipq4019";
          
          	memory {
          		device_type = "memory";
          		reg = <0x80000000 0x20000000>; /* OEM/board evidence: 512 MiB */
          	};
          
          	soc {
          		mdio@90000 {
          			status = "okay";
          			pinctrl-0 = <&hlwr832_mdio_pins>;
          			pinctrl-names = "default";
          		};
          
          		tcsr@1949000 {
          			compatible = "qcom,tcsr";
          			reg = <0x1949000 0x100>;
          			qcom,wifi_glb_cfg = <TCSR_WIFI_GLB_CFG>;
          		};
          
          		tcsr@194b000 {
          			compatible = "qcom,tcsr";
          			reg = <0x194b000 0x100>;
          			qcom,usb-hsphy-mode-select = <TCSR_USB_HSPHY_HOST_MODE>;
          			status = "okay";
          		};
          
          		ess_tcsr@1953000 {
          			compatible = "qcom,tcsr";
          			reg = <0x1953000 0x1000>;
          			qcom,ess-interface-select = <TCSR_ESS_PSGMII>;
          		};
          
          		tcsr@1957000 {
          			compatible = "qcom,tcsr";
          			reg = <0x1957000 0x100>;
          			qcom,wifi_noc_memtype_m0_m2 = <TCSR_WIFI_NOC_MEMTYPE_M0_M2>;
          		};
          
          		usb2@60f8800 {
          			status = "okay";
          		};
          
          		serial@78af000 {
          			pinctrl-0 = <&hlwr832_serial0_pins>;
          			pinctrl-names = "default";
          			status = "okay";
          		};
          
          		serial@78b0000 {
          			status = "disabled";
          		};
          
          		i2c@78b7000 {
          			status = "disabled";
          		};
          
          		usb3@8af8800 {
          			status = "okay";
          		};
          
          		keys {
          			compatible = "gpio-keys";
          			reset {
          				label = "reset";
          				gpios = <&tlmm 18 GPIO_ACTIVE_LOW>;
          				linux,code = <KEY_RESTART>;
          			};
          		};
          
          		leds {
          			compatible = "gpio-leds";
          			system {
          				label = "green:system";
          				gpios = <&tlmm 3 GPIO_ACTIVE_LOW>;
          			};
          			wlan2g {
          				label = "green:wlan2g";
          				gpios = <&tlmm 1 GPIO_ACTIVE_LOW>;
          			};
          			wlan5g {
          				label = "green:wlan5g";
          				gpios = <&tlmm 2 GPIO_ACTIVE_LOW>;
          			};
          			usb3 {
          				label = "green:usb3";
          				gpios = <&tlmm 5 GPIO_ACTIVE_LOW>;
          			};
          			internet {
          				label = "green:internet";
          				gpios = <&tlmm 4 GPIO_ACTIVE_LOW>;
          			};
          		};
          	};
          
          	/* 5G M.2 Modem Slot Power Enablers based on OEM schematics */
          	gpio-export {
          		compatible = "gpio-export";
          		#size-cells = <0>;
          		lte_pwr_sw { gpio-export,name = "lte_pwr_sw"; gpio-export,output = <1>; gpios = <&tlmm 0 GPIO_ACTIVE_HIGH>; };
          		lte_pwr_en1 { gpio-export,name = "lte_pwr_en1"; gpio-export,output = <1>; gpios = <&tlmm 9 GPIO_ACTIVE_HIGH>; };
          		lte_pwr_en2 { gpio-export,name = "lte_pwr_en2"; gpio-export,output = <1>; gpios = <&tlmm 10 GPIO_ACTIVE_HIGH>; };
          		lte_pwr_en3 { gpio-export,name = "lte_pwr_en3"; gpio-export,output = <1>; gpios = <&tlmm 11 GPIO_ACTIVE_HIGH>; };
          		lte_pwr_en4 { gpio-export,name = "lte_pwr_en4"; gpio-export,output = <1>; gpios = <&tlmm 8 GPIO_ACTIVE_HIGH>; };
          		lte_pwr_en5 { gpio-export,name = "lte_pwr_en5"; gpio-export,output = <1>; gpios = <&tlmm 34 GPIO_ACTIVE_HIGH>; };
          		lte_pwr_en6 { gpio-export,name = "lte_pwr_en6"; gpio-export,output = <1>; gpios = <&tlmm 35 GPIO_ACTIVE_HIGH>; };
          		lte_pwr_en7 { gpio-export,name = "lte_pwr_en7"; gpio-export,output = <1>; gpios = <&tlmm 20 GPIO_ACTIVE_HIGH>; };
          		lte_pwr_hub { gpio-export,name = "lte_pwr_hub"; gpio-export,output = <1>; gpios = <&tlmm 21 GPIO_ACTIVE_HIGH>; };
          	};
          };
          
          &blsp_dma { status = "okay"; };
          &qpic_bam { status = "okay"; };
          
          &tlmm {
          	hlwr832_mdio_pins: hlwr832-mdio-pins {
          		mux-mdio { pins = "gpio6"; function = "mdio"; bias-pull-up; };
          		mux-mdc { pins = "gpio7"; function = "mdc"; bias-pull-up; };
          	};
          
          	hlwr832_serial0_pins: hlwr832-serial0-pins {
          		mux { pins = "gpio16", "gpio17"; function = "blsp_uart0"; bias-disable; };
          	};
          
          	hlwr832_spi0_pins: hlwr832-spi0-pins {
          		data-clock { function = "blsp_spi0"; pins = "gpio13", "gpio14", "gpio15"; drive-strength = <12>; bias-disable; };
          		chip-select { function = "gpio"; pins = "gpio12"; drive-strength = <2>; bias-disable; output-high; };
          	};
          
          	nand_pins: hlwr832-nand-pins {
          		pullups { pins = "gpio53", "gpio58", "gpio59"; function = "qpic"; bias-pull-up; };
          		pulldowns {
          			pins = "gpio54", "gpio55", "gpio56", "gpio57", "gpio60", "gpio61",
          				"gpio62", "gpio63", "gpio64", "gpio65", "gpio66", "gpio67",
          				"gpio68", "gpio69";
          			function = "qpic"; bias-pull-down;
          		};
          	};
          };
          
          &usb3_ss_phy { status = "okay"; };
          &usb3_hs_phy { status = "okay"; };
          &usb2_hs_phy { status = "okay"; };
          
          &blsp1_spi1 {
          	pinctrl-0 = <&hlwr832_spi0_pins>;
          	pinctrl-names = "default";
          	status = "okay";
          	cs-gpios = <&tlmm 12 GPIO_ACTIVE_LOW>;
          
          	flash@0 {
          		reg = <0>;
          		compatible = "jedec,spi-nor";
          		spi-max-frequency = <24000000>;
          
          		partitions {
          			compatible = "fixed-partitions";
          			#address-cells = <1>;
          			#size-cells = <1>;
          
          			partition@0 { label = "0:SBL1"; reg = <0x000000 0x040000>; read-only; };
          			partition@40000 { label = "0:MIBIB"; reg = <0x040000 0x020000>; read-only; };
          			partition@60000 { label = "0:QSEE"; reg = <0x060000 0x060000>; read-only; };
          			partition@c0000 { label = "0:CDT"; reg = <0x0c0000 0x010000>; read-only; };
          			partition@d0000 { label = "0:DDRPARAMS"; reg = <0x0d0000 0x010000>; read-only; };
          			partition@e0000 { label = "0:APPSBLENV"; reg = <0x0e0000 0x010000>; read-only; };
          			partition@f0000 { label = "0:APPSBL"; reg = <0x0f0000 0x080000>; read-only; };
          
          			partition@170000 {
          				label = "0:ART";
          				reg = <0x170000 0x010000>;
          				read-only;
          				compatible = "nvmem-cells";
          				#address-cells = <1>;
          				#size-cells = <1>;
          
          				precal_art_1000: precal@1000 { reg = <0x1000 0x2f20>; };
          				precal_art_5000: precal@5000 { reg = <0x5000 0x2f20>; };
          				macaddr_gmac0: macaddr@0 { reg = <0x0 0x6>; };
          				macaddr_gmac1: macaddr@6 { reg = <0x6 0x6>; };
          			};
          		};
          	};
          };
          
          &nand {
          	pinctrl-0 = <&nand_pins>;
          	pinctrl-names = "default";
          	status = "okay";
          
          	nand@0 {
          		reg = <0>;
          		partitions {
          			compatible = "fixed-partitions";
          			#address-cells = <1>;
          			#size-cells = <1>;
          			partition@0 { label = "ubi"; reg = <0x00000000 0x04000000>; };
          		};
          	};
          };
          
          &wifi0 {
          	status = "okay";
          	nvmem-cell-names = "pre-calibration";
          	nvmem-cells = <&precal_art_1000>;
          	qcom,ath10k-calibration-variant = "Hooolink-HL-WR832";
          };
          
          &wifi1 {
          	status = "okay";
          	nvmem-cell-names = "pre-calibration";
          	nvmem-cells = <&precal_art_5000>;
          	qcom,ath10k-calibration-variant = "Hooolink-HL-WR832";
          };
          
          &gmac { status = "okay"; };
          &switch { status = "okay"; };
          
          &swport1 { status = "okay"; label = "lan1"; };
          &swport2 { status = "okay"; label = "lan2"; };
          &swport3 { status = "okay"; label = "lan3"; };
          &swport4 { status = "okay"; label = "lan4"; };
          &swport5 { status = "okay"; label = "wan"; };
          HLWR832_DTS

      - name: Inject HL-WR832 Config into ROOTer Build System
        working-directory: rooter
        run: |
          set -euxo pipefail
          
          # 1. Update and install all custom ROOTer feeds (The AI missed this completely!)
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 2. We use your base hardware config, but we MUST inject the ROOTer packages
          cp ../engineering/HL-WR832.config .config
          
          # Inject the ROOTer core packages that are missing from your config
          sed -i -e 's/# CONFIG_PACKAGE_ext-rooter-lite is not set/CONFIG_PACKAGE_ext-rooter-lite=y/g' .config
          sed -i -e 's/# CONFIG_PACKAGE_ext-rooter16 is not set/CONFIG_PACKAGE_ext-rooter16=y/g' .config
          
          # Inject the modem protocols manually just to be safe
          echo "CONFIG_PACKAGE_uqmi=y" >> .config
          echo "CONFIG_PACKAGE_umbim=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net-mbim=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-serial-option=y" >> .config
          
          # Run defconfig to let the system resolve dependencies based on what we just injected
          make defconfig

      - name: Download build sources
        id: download
        working-directory: rooter
        continue-on-error: true
        run: |
          make download -j2 V=s 2>&1 | tee ../download.log

      - name: Full ROOter engineering build
        id: fullbuild
        if: steps.download.outcome == 'success'
        working-directory: rooter
        continue-on-error: true
        run: |
          make -j2 V=s 2>&1 | tee ../build.log

      - name: Apply authorized libdeflate 1.18 source-hash correction
        working-directory: rooter
        run: |
          set -euxo pipefail
          sed -i 's/015cbd33b1382b812f7c035640709186bc5d3d6a0ab177bffa7948f26f64edf9/d35d1e0b1eadbee29e5d76cc9b059661147722b4c5ffccd2c1b4c65591a70bc0/' tools/libdeflate/Makefile

      - name: Download build sources
        id: dl
        working-directory: rooter
        continue-on-error: true
        run: |
          set -o pipefail
          make download -j2 V=s 2>&1 | tee ../download.log

      - name: Full ROOter engineering build
        id: fb
        if: steps.download.outcome == 'success'
        working-directory: rooter
        continue-on-error: true
        run: |
          set -o pipefail
          make -j2 V=s 2>&1 | tee ../build.log

      - name: Collect engineering build evidence
        if: always()
        run: |
          set -eux
          mkdir -p artifact
          cp engineering/HL-WR832-board-support.patch artifact/HL-WR832-authoritative-board-support.patch
          cp engineering/HL-WR832.config artifact/HL-WR832-authoritative.config
          [ ! -f bootstrap.log ] || cp bootstrap.log artifact/
          [ ! -f clone.log ] || cp clone.log artifact/
          if [ -f rooter/.config ]; then cp rooter/.config artifact/HL-WR832-Build17-effective.config; fi
          if [ -f rooter/target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-hooolink-hl-wr832.dts ]; then
            cp rooter/target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-hooolink-hl-wr832.dts artifact/HL-WR832-Build17-effective.dts
          fi
          [ ! -f download.log ] || cp download.log artifact/
          [ ! -f build.log ] || cp build.log artifact/

          if [ -d rooter/bin/targets/ipq40xx/generic ]; then
            mkdir -p artifact/bin-targets
            cp -a rooter/bin/targets/ipq40xx/generic/. artifact/bin-targets/ || true
          fi
          if [ -d rooter/bin/packages ]; then
            find rooter/bin/packages -type f -name '*.ipk' -print > artifact/package-files.txt || true
          fi

      - name: Upload Build 17 evidence and firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HL-WR832-ROOter2305-engineering-Build17
          path: artifact/
          if-no-files-found: warn
          retention-days: 30
